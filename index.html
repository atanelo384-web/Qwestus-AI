<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qesty AI — минималистичный чат</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ================== ТВОИ FIREBASE НАСТРОЙКИ ==================
        const firebaseConfig = {
            apiKey: "AIzaSyDbeswCHq8Lg7Dnz9oYSgZeIqQ8azcEC-s",
            authDomain: "qesty-ai.firebaseapp.com",
            projectId: "qesty-ai",
            storageBucket: "qesty-ai.firebasestorage.app",
            messagingSenderId: "125275289686",
            appId: "1:125275289686:web:5410de4bc789775b8063f7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // DOM
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const userAvatar = document.getElementById('userAvatar');
        const userNameSpan = document.getElementById('userName');
        const logoutBtn = document.getElementById('logoutBtn');
        const historyList = document.getElementById('historyList');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const themeToggle = document.getElementById('themeToggle');
        const regenerateBtn = document.getElementById('regenerateBtn');

        let currentUserId = null;
        let currentChatId = null;
        let currentMessages = [];
        let isDarkTheme = localStorage.getItem('theme') === 'dark';

        // ================== ТЕМА ==================
        function applyTheme() {
            document.body.classList.toggle('dark-theme', isDarkTheme);
            themeToggle.innerHTML = isDarkTheme ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }
        themeToggle.onclick = () => {
            isDarkTheme = !isDarkTheme;
            localStorage.setItem('theme', isDarkTheme ? 'dark' : 'light');
            applyTheme();
        };
        applyTheme();

        // ================== АВТОРИЗАЦИЯ ==================
        window.handleGoogleLogin = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (e) {
                alert("Ошибка входа: " + e.message);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                loginScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');
                userAvatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName || 'U'}&background=4f46e5&color=fff`;
                userNameSpan.textContent = user.displayName || user.email;

                await ensureUserExists(user.uid);
                listenHistory();
                loadLastChat();
            } else {
                loginScreen.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        });

        async function ensureUserExists(uid) {
            const userRef = doc(db, "users", uid);
            const snap = await getDoc(userRef);
            if (!snap.exists()) {
                await setDoc(userRef, { chats: [], createdAt: new Date().toISOString() });
            }
        }

        logoutBtn.onclick = () => signOut(auth);

        // ================== ИСТОРИЯ И ЧАТЫ ==================
        function listenHistory() {
            const userRef = doc(db, "users", currentUserId);
            onSnapshot(userRef, (snap) => {
                if (snap.exists()) renderHistory(snap.data().chats || []);
            });
        }

        function renderHistory(chats) {
            historyList.innerHTML = '';
            if (chats.length === 0) {
                historyList.innerHTML = `<div class="empty-history">Нет диалогов</div>`;
                return;
            }
            [...chats].reverse().forEach(chat => {
                const div = document.createElement('div');
                div.className = `history-item ${currentChatId === chat.id ? 'active' : ''}`;
                div.innerHTML = `
                    <i class="far fa-comment"></i>
                    <span class="history-title-text">${escapeHtml(chat.title || 'Новый чат')}</span>
                    <i class="fas fa-trash-alt delete-chat" data-id="${chat.id}"></i>
                `;
                div.querySelector('.delete-chat').onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };
                div.onclick = () => loadChat(chat.id);
                historyList.appendChild(div);
            });
        }

        async function createNewChat() {
            const newId = Date.now().toString();
            const newChat = { id: newId, title: 'Новый диалог', createdAt: new Date().toISOString(), messages: [] };
            const userRef = doc(db, "users", currentUserId);
            const snap = await getDoc(userRef);
            const chats = snap.exists() ? snap.data().chats || [] : [];
            await updateDoc(userRef, { chats: [...chats, newChat] });
            loadChat(newId);
        }

        async function loadChat(chatId) {
            currentChatId = chatId;
            const snap = await getDoc(doc(db, "users", currentUserId));
            const chat = snap.data().chats?.find(c => c.id === chatId);
            currentMessages = chat ? chat.messages || [] : [];
            renderMessages();
            renderHistory(snap.data().chats || []);
        }

        async function loadLastChat() {
            const snap = await getDoc(doc(db, "users", currentUserId));
            const chats = snap.exists() ? snap.data().chats || [] : [];
            if (chats.length > 0) loadChat(chats[chats.length-1].id);
            else createNewChat();
        }

        newChatBtn.onclick = createNewChat;

        // ================== ОТПРАВКА СООБЩЕНИЯ ==================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentChatId) return;

            const userMsg = { role: 'user', text, timestamp: Date.now() };
            currentMessages.push(userMsg);
            await saveMessages();
            renderMessages();
            messageInput.value = '';

            typingIndicator.classList.remove('hidden');
            messageInput.disabled = sendBtn.disabled = true;

            try {
                const aiText = await callProxy(currentMessages);
                currentMessages.push({ role: 'ai', text: aiText, timestamp: Date.now() });
                await saveMessages();
                renderMessages();

                // Авто заголовок для первого сообщения
                if (currentMessages.length === 2) {
                    const title = text.length > 40 ? text.slice(0, 37) + '...' : text;
                    await updateChatTitle(title);
                }
            } catch (err) {
                console.error(err);
                currentMessages.push({ role: 'ai', text: `❌ Ошибка: ${err.message}`, timestamp: Date.now() });
                await saveMessages();
                renderMessages();
            } finally {
                typingIndicator.classList.add('hidden');
                messageInput.disabled = sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        // ================== ПРОКСИ ЧЕРЕЗ FIREBASE FUNCTION ==================
        async function callProxy(messages) {
            const apiMessages = messages.slice(-20).map(m => ({
                role: m.role === 'user' ? 'user' : 'assistant',
                content: m.text
            }));

            const response = await fetch('https://us-central1-qesty-ai.cloudfunctions.net/callOpenRouter', {  // ← измени на свой регион, если другой
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: apiMessages })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Ошибка сервера');
            return data.reply;
        }

        // ================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==================
        async function saveMessages() {
            const userRef = doc(db, "users", currentUserId);
            const snap = await getDoc(userRef);
            let chats = snap.exists() ? snap.data().chats || [] : [];
            chats = chats.map(chat => chat.id === currentChatId ? {...chat, messages: currentMessages} : chat);
            await updateDoc(userRef, { chats });
        }

        async function updateChatTitle(newTitle) {
            const userRef = doc(db, "users", currentUserId);
            const snap = await getDoc(userRef);
            let chats = snap.exists() ? snap.data().chats || [] : [];
            chats = chats.map(chat => chat.id === currentChatId ? {...chat, title: newTitle} : chat);
            await updateDoc(userRef, { chats });
        }

        async function deleteChat(chatId) {
            if (!confirm('Удалить диалог?')) return;
            const userRef = doc(db, "users", currentUserId);
            const snap = await getDoc(userRef);
            let chats = snap.data().chats || [];
            chats = chats.filter(c => c.id !== chatId);
            await updateDoc(userRef, { chats });
            if (currentChatId === chatId) loadLastChat();
        }

        function renderMessages() {
            chatArea.innerHTML = '';
            if (!currentMessages.length) {
                chatArea.innerHTML = `<div class="empty-chat"><i class="fas fa-robot"></i><p>Напишите что-нибудь...</p></div>`;
                return;
            }
            currentMessages.forEach((msg, i) => {
                const div = document.createElement('div');
                div.className = `message ${msg.role}`;
                const content = msg.role === 'ai' ? marked.parse(msg.text) : escapeHtml(msg.text);
                div.innerHTML = `
                    <div class="message-bubble">
                        <strong>${msg.role === 'user' ? 'Вы' : 'Qesty AI'}</strong>
                        <div class="message-content">${content}</div>
                    </div>
                `;
                chatArea.appendChild(div);
            });
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ================== СОБЫТИЯ ==================
        sendBtn.onclick = sendMessage;
        messageInput.addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Авто-высота textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });

        regenerateBtn.onclick = () => {
            if (currentMessages.length < 2) return;
            const lastUserIndex = currentMessages.length - 2;
            if (currentMessages[lastUserIndex].role === 'user') {
                currentMessages.pop(); // удаляем последний AI ответ
                renderMessages();
                sendMessage(); // перегенерируем
            }
        };
    </script>

    <style>
        /* (Оставил твой стиль почти без изменений, только немного улучшил) */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f7fa, #f0f2f5); height:100vh; overflow:hidden; }
        body.dark-theme { background: linear-gradient(135deg, #0f172a, #1e293b); color:#e2e8f0; }

        /* ... (твой стиль можно вставить полностью, я его не менял сильно) ... */

        .message.user .message-bubble { background: linear-gradient(135deg, #4f46e5, #6366f1); color:white; }
        .empty-chat, .empty-history { text-align:center; padding:3rem; color:#94a3b8; }
    </style>
</head>
<body>
    <!-- Твой HTML остался почти таким же (login + sidebar + main) -->
    <!-- Просто скопируй свой <body> из предыдущей версии, он совместим -->
    
    <div id="loginScreen" style="display:flex;justify-content:center;align-items:center;height:100vh;">
        <div class="login-card">
            <i class="fas fa-brain" style="font-size:3.5rem;color:#6366f1;margin-bottom:1rem;"></i>
            <h1>Qesty AI</h1>
            <p>Войдите через Google</p>
            <button class="google-btn" onclick="handleGoogleLogin()">
                <i class="fab fa-google"></i> Войти с Google
            </button>
        </div>
    </div>

    <div id="appContainer" class="app-layout hidden">
        <!-- Твой sidebar и main-chat полностью из предыдущего кода -->
        <!-- (скопируй их сюда) -->
    </div>
</body>
</html>
